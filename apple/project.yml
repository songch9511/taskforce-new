# Xcode 프로젝트 정의. 이 파일을 고친 뒤 `cd apple && xcodegen`으로 Taskforce.xcodeproj를 다시 만든다.
name: Taskforce
options:
  bundleIdPrefix: dev.taskforcelabs
  # 화면 틀은 영어 (docs/BRAND.md "UI 문구"). 시스템 부품(알림 버튼 · Apple 로그인 버튼)도 같은 언어로 맞춘다.
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  # 릴리스(TestFlight)는 운영 서버 주소로 고정한다 (Release.xcconfig가 Base를 불러온 뒤 API_BASE_URL만 바꾼다)
  Release: Config/Release.xcconfig
settings:
  base:
    SDKROOT: auto
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: U9DWQKQFMW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TaskforceKit:
    path: Packages/TaskforceKit
  # Sign in with Google (로그인만, 기본 범위 openid · email · profile). 9.0부터 nonce를 넘길 수 있다(Supabase nonce 확인).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
targets:
  Taskforce:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Taskforce
    dependencies:
      - package: TaskforceKit
        product: TaskforceKit
      - package: TaskforceKit
        product: TaskforceUI
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Taskforce
        INFOPLIST_FILE: Taskforce/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskforce
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac은 에이전트 앱(Dock 없음, 메뉴 막대 + ⌥Space 런처). iOS에는 붙이지 않는다.
        "INFOPLIST_KEY_LSUIElement[sdk=macosx*]": YES
        CODE_SIGN_ENTITLEMENTS: Taskforce/Taskforce-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Taskforce/Taskforce-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  TaskforceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TaskforceTests
    dependencies:
      - target: Taskforce
      - package: TaskforceKit
        product: TaskforceKit
      - package: TaskforceKit
        product: Supabase
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Taskforce.app/Contents/MacOS/Taskforce"
schemes:
  Taskforce:
    build:
      targets:
        Taskforce: all
    test:
      targets:
        - TaskforceTests
    run:
      config: Debug
    archive:
      config: Release
