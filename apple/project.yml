# Xcode 프로젝트 정의. 이 파일을 고친 뒤 `cd apple && xcodegen`으로 Taskforce.xcodeproj를 다시 만든다.
name: Taskforce
options:
  bundleIdPrefix: dev.taskforcelabs
  developmentLanguage: ko
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: U9DWQKQFMW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TaskforceKit:
    path: Packages/TaskforceKit
targets:
  Taskforce:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Taskforce
    dependencies:
      - package: TaskforceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Taskforce
        INFOPLIST_FILE: Taskforce/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskforce
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Taskforce/Taskforce-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Taskforce/Taskforce-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  Taskforce:
    build:
      targets:
        Taskforce: all
    run:
      config: Debug
    archive:
      config: Release
