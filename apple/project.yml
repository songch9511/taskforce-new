# Xcode 프로젝트 정의. 이 파일을 고친 뒤 `cd apple && xcodegen`으로 Taskforce.xcodeproj를 다시 만든다.
name: Taskforce
options:
  bundleIdPrefix: dev.taskforcelabs
  # 화면 틀은 영어 (docs/BRAND.md "UI 문구"). 시스템 부품(알림 버튼 · Apple 로그인 버튼)도 같은 언어로 맞춘다.
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
# Debug-Test = Debug + 격리된 테스트 호스트 번들 ID (Config/DebugTest.xcconfig). 스킴의 Test 액션만 쓴다. 이름에 Debug가 있어야 패키지가 Debug로 빌드된다.
configs:
  Debug: debug
  Release: release
  Debug-Test: debug
configFiles:
  Debug: Config/Base.xcconfig
  Debug-Test: Config/DebugTest.xcconfig
  # Mac 직접 배포 Release는 운영 서버 주소로 고정한다 (Release.xcconfig가 Base 뒤 API_BASE_URL만 바꾼다)
  Release: Config/Release.xcconfig
settings:
  base:
    SDKROOT: auto
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: U9DWQKQFMW
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TaskforceKit:
    path: Packages/TaskforceKit
  # Sign in with Google (로그인만, 기본 범위 openid · email · profile). 9.0부터 nonce를 넘길 수 있다(Supabase nonce 확인).
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
  # Mac 앱 자동 업데이트 (OA M1b, docs/go-live/mac-dmg.md "자동 업데이트"). Mac 앱 타깃에만 연결하고 정확한 버전 하나로 고정한다
  # (공개된 지 2주 넘은 정식 2.x. 올릴 때는 이 숫자와 Package.resolved를 함께 바꾼다).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Taskforce:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: Taskforce
        excludes:
          # 데스크톱 세션과 대화하는 중계 mod (OA PR-D3k): 아래 세 파일만 폴더 모양 그대로 번들에 넣는다 (`tests/`의 mod 시험은 번들에 넣지 않는다)
          - "Resources/tf-relay/**"
      # 번들 `Contents/Resources/tf-relay/{.claude-plugin/plugin.json, hooks/hooks.json, hooks/register.js}`: 서명된 번들 안 읽기 전용 경로. `claude --plugin-dir`는 이 경로만 쓰고,
      # 띄우기 전에 Kit(`ClaudeAppRelayMod`)이 파일 셋과 SHA-256을 상수와 맞춰 본다 (파일을 고치면 그 상수도 함께 고친다)
      - path: Taskforce/Resources/tf-relay/.claude-plugin/plugin.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: tf-relay/.claude-plugin
      - path: Taskforce/Resources/tf-relay/hooks/hooks.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: tf-relay/hooks
      - path: Taskforce/Resources/tf-relay/hooks/register.js
        buildPhase:
          copyFiles:
            destination: resources
            subpath: tf-relay/hooks
    dependencies:
      - package: TaskforceKit
        product: TaskforceKit
      - package: TaskforceKit
        product: TaskforceUI
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Sparkle
        product: Sparkle
      # Claude Code helper 둘 (OA D3a 계약 2.3): `Contents/Helpers/`에 넣고 복사할 때 서명한다 (Xcode가 중첩 코드 서명 순서를 지킨다, Q3)
      - target: tf-agent-hook
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: tf-agent-mcp
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # 지킴이 helper (OA D3a 13장): `Contents/Helpers/Taskforce Agent.app`
      - target: TaskforceAgent
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Taskforce
        INFOPLIST_FILE: Taskforce/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskforce
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac 에이전트 앱: Dock 창 없이 메뉴 막대 + ⌥Space 런처.
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_ENTITLEMENTS: Taskforce/Taskforce-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
  # Claude Code 훅 helper (OA D3a 계약 2.3): 인터프리터 없는 Mach-O, TaskforceAgentWire만 링크한다 (Supabase · TaskforceKit 0). 권한 파일 없음
  tf-agent-hook:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/tf-agent-hook
    dependencies:
      - package: TaskforceKit
        product: TaskforceAgentWire
    settings:
      base:
        PRODUCT_NAME: tf-agent-hook
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).agent-hook
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # Taskforce MCP 서버 helper `tf` (OA D3a 계약 3.3)
  tf-agent-mcp:
    type: tool
    platform: macOS
    sources:
      - path: Helpers/tf-agent-mcp
    dependencies:
      - package: TaskforceKit
        product: TaskforceAgentWire
    settings:
      base:
        PRODUCT_NAME: tf-agent-mcp
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).agent-mcp
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # 지킴이 helper "Taskforce Agent" (OA D3a 13장, 사용자 결정 2026-10-17): 앱이 disclaim으로 띄우는 책임 프로세스. 화면 · Dock 없음(LSUIElement · NSApplication 0),
  # TaskforceAgentWire만 링크한다 (시스템 라이브러리만). macOS 권한 창은 이 이름으로 뜬다
  TaskforceAgent:
    type: application
    platform: macOS
    sources:
      - path: Helpers/tf-agent-keeper
    dependencies:
      - package: TaskforceKit
        product: TaskforceAgentWire
    settings:
      base:
        PRODUCT_NAME: Taskforce Agent
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).agent
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskforce Agent
        INFOPLIST_KEY_LSUIElement: YES
        # 작업 폴더가 문서 · 데스크톱 · 다운로드 · 외장 · 네트워크 볼륨에 있으면 macOS 접근 창이 이 이름으로 뜬다 (OA Settings › Your agents 10장, 사용자 승인 2026-10-18).
        # 다섯 키가 같은 한 문장이다: 승인된 글 그대로 (`AgentSettingsCopy.agentPurpose`와 시험이 한 글자까지 맞춰 본다)
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "Taskforce Agent runs Claude Code in the folders you choose for your projects."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "Taskforce Agent runs Claude Code in the folders you choose for your projects."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Taskforce Agent runs Claude Code in the folders you choose for your projects."
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: "Taskforce Agent runs Claude Code in the folders you choose for your projects."
        INFOPLIST_KEY_NSNetworkVolumesUsageDescription: "Taskforce Agent runs Claude Code in the folders you choose for your projects."
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # 시험 전용 가짜 `claude` (OA D3a 계약 4.4 M3). 시험 대상의 빌드 의존일 뿐 앱 번들에 넣지 않는다
  FakeClaudeCode:
    type: tool
    platform: macOS
    sources:
      - path: Packages/TaskforceKit/Sources/FakeClaudeCode
    settings:
      base:
        PRODUCT_NAME: FakeClaudeCode
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).fake-claude
        SKIP_INSTALL: YES
  TaskforceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TaskforceTests
    dependencies:
      - target: Taskforce
      - target: FakeClaudeCode
        link: false
      - package: TaskforceKit
        product: TaskforceKit
      - package: TaskforceKit
        product: Supabase
    # 테스트 호스트(Taskforce.app)의 번들 ID가 실사용 앱과 같으면 호스트가 뜨기 전에 빌드를 실패시킨다. 호스트의 Info.plist가 만들어진 뒤에 돈다(입력 파일).
    preBuildScripts:
      - name: Check test host isolation
        script: '"$SRCROOT/Scripts/check-test-host-isolation.sh"'
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/Taskforce.app/Contents/Info.plist
          - $(SRCROOT)/Config/Base.xcconfig
        basedOnDependencyAnalysis: false
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Taskforce.app/Contents/MacOS/Taskforce"
schemes:
  Taskforce:
    build:
      targets:
        Taskforce: all
    test:
      config: Debug-Test
      targets:
        - TaskforceTests
    run:
      config: Debug
    archive:
      config: Release
