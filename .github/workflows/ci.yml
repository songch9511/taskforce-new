name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # 실행 코어의 잠금 경합(스위치 for share · intent unique)은 PGlite(연결 하나)로 볼 수 없어 실제 Postgres로 시험한다 (npm run test:pg).
    # 실패하면 병합하지 않는다 (건너뛰기 없음).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:pg
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npm run eval
      - run: npm run build

  # Apple 앱: TaskforceKit 테스트와 macOS 앱 테스트 · 빌드.
  # Liquid Glass · Swift 6 때문에 Xcode 26 SDK가 필요하다. macos-latest는 예고 없이 옮겨 가므로
  # 러너 이미지와 Xcode를 고정한다. 이미지에서 이 Xcode가 빠지면 xcode-select 단계가 실패하니 그때 올린다.
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.6"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          swift --version
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          # 앱의 고정 버전(Google Sign-In 포함)은 xcodeproj 작업 공간의 Package.resolved, 패키지 테스트는 TaskforceKit 것
          key: swiftpm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apple/Packages/TaskforceKit/Package.resolved', 'apple/Taskforce.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
      # Secrets.xcconfig는 커밋하지 않는다(Base.xcconfig가 #include?로 읽는다). 빌드만 하므로 예제 값으로 채운다.
      - name: Secrets.xcconfig from example
        run: cp apple/Config/Secrets.example.xcconfig apple/Config/Secrets.xcconfig
      - name: swift test (TaskforceKit)
        working-directory: apple/Packages/TaskforceKit
        # 의도적인 fork 부하가 무관한 인증 · bridge · UI 타이머 시험의 실행 자원을 빼앗지 않게 별도 프로세스에서 실행한다.
        # 같은 정규식의 여집합과 본집합을 모두 필수로 실행한다. 시험 · 내부 동시성 · 기한은 그대로다.
        run: |
          churn='^TaskforceKitTests\.ClaudeKeeperChurnTests/'
          swift test list > "$RUNNER_TEMP/kit-tests.txt"
          grep -E "$churn" "$RUNNER_TEMP/kit-tests.txt"
          swift test --skip-build --skip "$churn"
          swift test --skip-build --filter "$churn"
      # swift test는 Asset Catalog를 컴파일하지 않고 복사만 한다. 색 토큰 테스트를 actool이 컴파일한 카탈로그로도 돌린다.
      - name: Test TaskforceUI tokens (compiled asset catalog)
        working-directory: apple/Packages/TaskforceKit
        env:
          TEST_RUNNER_TF_REQUIRE_COMPILED_CATALOG: "1"
        run: >-
          xcodebuild test
          -scheme TaskforceKit-Package
          -destination 'platform=macOS'
          -only-testing:TaskforceUITests
          -derivedDataPath "$RUNNER_TEMP/DerivedDataKit"
      # 기본 명령 그대로 돈다: Taskforce 스킴의 Test 액션이 Debug-Test 설정을 써서 테스트 호스트가 dev.taskforcelabs.unittest.taskforce로 뜬다
      # (apple/README.md "테스트 격리"). -configuration · BUNDLE_ID_PREFIX · CODE_SIGNING_ALLOWED를 주지 않는다: 기본 격리가 이 단계의 시험이다.
      - name: Test macOS launcher
        run: >-
          xcodebuild test
          -project apple/Taskforce.xcodeproj
          -scheme Taskforce
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
      # 실사용 번들 ID(dev.taskforcelabs.taskforce)로는 테스트 호스트를 만들 수 없다: 호스트가 뜨기 전 빌드 단계가 거부해야 한다.
      # build-for-testing이라 테스트는 돌지 않는다. 거부 문구까지 확인해서 다른 이유로 실패한 것과 구별한다.
      - name: Reject a test host with the real app ID
        run: |
          if xcodebuild build-for-testing \
            -project apple/Taskforce.xcodeproj \
            -scheme Taskforce \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            BUNDLE_ID_PREFIX=dev.taskforcelabs > "$RUNNER_TEMP/unsafe-host.log" 2>&1; then
            cat "$RUNNER_TEMP/unsafe-host.log"
            echo "실사용 번들 ID로 테스트 호스트가 빌드됐다. 거부돼야 한다."
            exit 1
          fi
          if ! grep -q "테스트 호스트가 실사용 앱과 같은 ID입니다" "$RUNNER_TEMP/unsafe-host.log"; then
            cat "$RUNNER_TEMP/unsafe-host.log"
            echo "기대한 실사용 앱 ID 거부 오류를 확인하지 못했습니다."
            exit 1
          fi
      - name: Preserve test host rejection log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsafe-host-log
          path: ${{ runner.temp }}/unsafe-host.log
          if-no-files-found: ignore
      - name: Build macOS
        run: >-
          xcodebuild build
          -project apple/Taskforce.xcodeproj
          -scheme Taskforce
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
