name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run eval
      - run: npm run build

  # Apple 앱: TaskforceKit 테스트와 iOS · macOS 빌드 (docs/go-live/runbook.md C12).
  # Liquid Glass · Swift 6 때문에 Xcode 26 SDK가 필요하다. macos-latest는 예고 없이 옮겨 가므로
  # 러너 이미지와 Xcode를 고정한다. 이미지에서 이 Xcode가 빠지면 xcode-select 단계가 실패하니 그때 올린다.
  apple:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.6"
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          swift --version
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apple/Packages/TaskforceKit/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-
      # Secrets.xcconfig는 커밋하지 않는다(Base.xcconfig가 #include?로 읽는다). 빌드만 하므로 예제 값으로 채운다.
      - name: Secrets.xcconfig from example
        run: cp apple/Config/Secrets.example.xcconfig apple/Config/Secrets.xcconfig
      - name: swift test (TaskforceKit)
        working-directory: apple/Packages/TaskforceKit
        run: swift test
      - name: Build macOS
        run: >-
          xcodebuild build
          -project apple/Taskforce.xcodeproj
          -scheme Taskforce
          -configuration Debug
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
      - name: Build iOS Simulator
        run: >-
          xcodebuild build
          -project apple/Taskforce.xcodeproj
          -scheme Taskforce
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
